<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" fill="none">
  <defs>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="amberHoriz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardArt1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="50%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardArt2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Main Dark Background -->
  <rect width="800" height="440" fill="#09090b" />
  <rect width="800" height="440" fill="url(#bgGlow)" />

  <!-- Header Container -->
  <rect width="800" height="92" fill="#09090b" fill-opacity="0.92" />
  <line x1="0" y1="92" x2="800" y2="92" stroke="#27272a" stroke-width="1" />

  <!-- Header Top Row (Centered max-w container x=80..720) -->
  <!-- Brand Icon -->
  <rect x="80" y="12" width="30" height="30" rx="8" fill="url(#amberGrad)" />
  <!-- Sparkles Icon -->
  <path d="M94.2 17.5a.7.7 0 0 1 1.4 0l.75 3.9a1.4 1.4 0 0 0 1.1 1.1l3.9.75a.7.7 0 0 1 0 1.4l-3.9.75a1.4 1.4 0 0 0-1.1 1.1l-.75 3.9a.7.7 0 0 1-1.4 0l-.75-3.9a1.4 1.4 0 0 0-1.1-1.1l-3.9-.75a.7.7 0 0 1 0-1.4l3.9-.75a1.4 1.4 0 0 0 1.1-1.1z" fill="#09090b" />
  <circle cx="89" cy="30" r="1.3" fill="#09090b" />

  <!-- Brand Text -->
  <text x="118" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="url(#amberHoriz)" letter-spacing="-0.5">LORCADLE</text>
  <text x="118" y="39" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#a1a1aa">Le défi quotidien Disney Lorcana</text>

  <!-- Right Controls: Streak, Langs, Theme -->
  <!-- Streak Badge -->
  <rect x="526" y="14" width="42" height="25" rx="7" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35" />
  <path d="M540 19.5c.6 2.4 2.4 3.9 1.8 6.6a4.2 4.2 0 0 1-8.4 0c0-1.2.6-2.1.6-2.1s1.2 1.2 2.4 0c0-1.2-.9-1.8-.9-3 0-1.2 1.5-2.4 1.5-2.4z" fill="#f59e0b" />
  <text x="554" y="30.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">7</text>

  <!-- Language Switcher FR | EN | DE | IT -->
  <rect x="575" y="14" width="110" height="25" rx="7" fill="#18181b" stroke="#27272a" />
  <rect x="577" y="16" width="26" height="21" rx="5" fill="url(#amberGrad)" />
  <text x="590" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#09090b" text-anchor="middle">FR</text>
  <text x="616" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#a1a1aa" text-anchor="middle">EN</text>
  <text x="643" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#a1a1aa" text-anchor="middle">DE</text>
  <text x="670" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#a1a1aa" text-anchor="middle">IT</text>

  <!-- Theme Toggle -->
  <rect x="692" y="14" width="28" height="25" rx="7" fill="#18181b" stroke="#27272a" />
  <circle cx="706" cy="26.5" r="4" stroke="#fbbf24" stroke-width="1.6" />

  <!-- Navigation Mode Tabs (3 cols: x=80..720) -->
  <!-- Tab 1: Guess the Card (Active) -->
  <rect x="80" y="50" width="208" height="32" rx="10" fill="url(#amberGrad)" />
  <text x="184" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#09090b" text-anchor="middle">✦ Guess the Card</text>

  <!-- Tab 2: Guess the Character -->
  <rect x="296" y="50" width="208" height="32" rx="10" fill="#18181b" stroke="#27272a" />
  <text x="400" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#d4d4d8" text-anchor="middle">Guess the Character</text>

  <!-- Tab 3: Carte Floutée -->
  <rect x="512" y="50" width="208" height="32" rx="10" fill="#18181b" stroke="#27272a" />
  <text x="616" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#d4d4d8" text-anchor="middle">Carte Floutée</text>

  <!-- Main Heading -->
  <text x="400" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.4">Guess the Card</text>
  <text x="400" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#a1a1aa" text-anchor="middle">Devine la carte du jour parmi toutes les cartes Lorcana</text>

  <!-- Search Input Box -->
  <rect x="190" y="154" width="420" height="38" rx="12" fill="#18181b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="210" cy="172" r="5.5" stroke="#f59e0b" stroke-width="1.8" />
  <line x1="214" y1="176" x2="218" y2="180" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
  <text x="228" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#71717a">Tape le nom d’une carte (ex: Ariel, Soyez prêtes...)</text>

  <!-- 8-Column Comparison Grid (x=80..720, each col width=74, gap=6) -->
  <!-- Column Headers (y=206, h=24) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#fbbf24" text-anchor="middle">
    <rect x="80" y="206" width="74" height="24" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="117" y="221.5">CARTE</text>

    <rect x="160" y="206" width="74" height="24" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="197" y="221.5">TYPE</text>

    <rect x="240" y="206" width="74" height="24" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="277" y="221.5">ENCRE</text>

    <rect x="320" y="206" width="74" height="24" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="357" y="221.5">COÛT</text>

    <rect x="400" y="206" width="74" height="24" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="437" y="221.5">ENCRABLE</text>

    <rect x="480" y="206" width="74" height="24" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="517" y="221.5">FRANCHISE</text>

    <rect x="560" y="206" width="74" height="24" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="597" y="221.5">SET</text>

    <rect x="640" y="206" width="74" height="24" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="677" y="221.5">RARETÉ</text>
  </g>

  <!-- Row 1: Exact Match (y=238, h=70) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">
    <!-- Col 1: Card Thumbnail -->
    <rect x="80" y="238" width="74" height="70" rx="10" fill="#18181b" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5" />
    <rect x="99" y="244" width="36" height="44" rx="4" fill="url(#cardArt1)" stroke="#fbbf24" stroke-opacity="0.4" />
    <circle cx="117" cy="262" r="8" fill="#e9d5ff" fill-opacity="0.35" />
    <text x="117" y="301" font-size="9" fill="#f4f4f5">Elsa - Esprit</text>

    <!-- Col 2: Type (Exact) -->
    <rect x="160" y="238" width="74" height="70" rx="10" fill="#059669" stroke="#34d399" stroke-width="1.5" />
    <text x="197" y="277" font-size="10.5" fill="#ffffff">Personnage</text>

    <!-- Col 3: Encre (Exact) -->
    <rect x="240" y="238" width="74" height="70" rx="10" fill="#059669" stroke="#34d399" stroke-width="1.5" />
    <circle cx="277" cy="264" r="5.5" fill="#a855f7" stroke="#e9d5ff" stroke-width="1.2" />
    <text x="277" y="284" font-size="10.5" fill="#ffffff">Améthyste</text>

    <!-- Col 4: Coût (Exact) -->
    <rect x="320" y="238" width="74" height="70" rx="10" fill="#059669" stroke="#34d399" stroke-width="1.5" />
    <text x="357" y="279" font-size="18" font-weight="900" fill="#ffffff">8</text>

    <!-- Col 5: Encrable (Exact) -->
    <rect x="400" y="238" width="74" height="70" rx="10" fill="#059669" stroke="#34d399" stroke-width="1.5" />
    <text x="437" y="277" font-size="11" fill="#ffffff">Non</text>

    <!-- Col 6: Franchise (Exact) -->
    <rect x="480" y="238" width="74" height="70" rx="10" fill="#059669" stroke="#34d399" stroke-width="1.5" />
    <text x="517" y="271" font-size="9.5" fill="#ffffff">La Reine</text>
    <text x="517" y="283" font-size="9.5" fill="#ffffff">des Neiges</text>

    <!-- Col 7: Set (Exact) -->
    <rect x="560" y="238" width="74" height="70" rx="10" fill="#059669" stroke="#34d399" stroke-width="1.5" />
    <text x="597" y="277" font-size="11.5" fill="#ffffff">Set 1</text>

    <!-- Col 8: Rareté (Exact) -->
    <rect x="640" y="238" width="74" height="70" rx="10" fill="#059669" stroke="#34d399" stroke-width="1.5" />
    <text x="677" y="277" font-size="10.5" fill="#ffffff">Légendaire</text>
  </g>

  <!-- Row 2: Previous Guess with Partial & Directional Clues (y=316, h=70) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">
    <!-- Col 1: Card Thumbnail -->
    <rect x="80" y="316" width="74" height="70" rx="10" fill="#18181b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="99" y="322" width="36" height="44" rx="4" fill="url(#cardArt2)" stroke="#fbbf24" stroke-opacity="0.4" />
    <circle cx="117" cy="340" r="8" fill="#fde68a" fill-opacity="0.35" />
    <text x="117" y="379" font-size="9" fill="#f4f4f5">Mickey - Sorcier</text>

    <!-- Col 2: Type (Exact) -->
    <rect x="160" y="316" width="74" height="70" rx="10" fill="#059669" stroke="#34d399" stroke-width="1.5" />
    <text x="197" y="355" font-size="10.5" fill="#ffffff">Personnage</text>

    <!-- Col 3: Encre (Partial Dual-Ink) -->
    <rect x="240" y="316" width="74" height="70" rx="10" fill="#f59e0b" stroke="#fcd34d" stroke-width="1.5" />
    <circle cx="271" cy="342" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="1" />
    <circle cx="283" cy="342" r="5" fill="#0ea5e9" stroke="#ffffff" stroke-width="1" />
    <text x="277" y="362" font-size="9.5" font-weight="800" fill="#09090b">Améth. / Saph.</text>

    <!-- Col 4: Coût (Wrong + Higher Arrow) -->
    <rect x="320" y="316" width="74" height="70" rx="10" fill="#be123c" stroke="#fb7185" stroke-width="1.5" />
    <path d="M357 328 L372 346 H362 V372 H352 V346 H342 Z" fill="#ffffff" fill-opacity="0.22" />
    <text x="357" y="357" font-size="18" font-weight="900" fill="#ffffff">4</text>

    <!-- Col 5: Encrable (Wrong) -->
    <rect x="400" y="316" width="74" height="70" rx="10" fill="#be123c" stroke="#fb7185" stroke-width="1.5" />
    <text x="437" y="355" font-size="11" fill="#ffffff">Oui</text>

    <!-- Col 6: Franchise (Wrong) -->
    <rect x="480" y="316" width="74" height="70" rx="10" fill="#be123c" stroke="#fb7185" stroke-width="1.5" />
    <text x="517" y="355" font-size="10.5" fill="#ffffff">Fantasia</text>

    <!-- Col 7: Set (Wrong + Lower Arrow) -->
    <rect x="560" y="316" width="74" height="70" rx="10" fill="#be123c" stroke="#fb7185" stroke-width="1.5" />
    <path d="M597 374 L612 356 H602 V330 H592 V356 H582 Z" fill="#ffffff" fill-opacity="0.22" />
    <text x="597" y="355" font-size="11.5" fill="#ffffff">Set 4</text>

    <!-- Col 8: Rareté (Wrong + Higher Arrow) -->
    <rect x="640" y="316" width="74" height="70" rx="10" fill="#be123c" stroke="#fb7185" stroke-width="1.5" />
    <path d="M677 328 L692 346 H682 V372 H672 V346 H662 Z" fill="#ffffff" fill-opacity="0.22" />
    <text x="677" y="355" font-size="10" fill="#ffffff">Super Rare</text>
  </g>

  <!-- Bottom Legend Pill (y=398, h=28) -->
  <rect x="140" y="398" width="520" height="28" rx="8" fill="#18181b" stroke="#27272a" />
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#d4d4d8">
    <text x="172" y="415.5" font-weight="800" fill="#fbbf24">Légende :</text>
    <rect x="232" y="406.5" width="11" height="11" rx="2.5" fill="#059669" />
    <text x="248" y="415.5">Exact</text>

    <rect x="290" y="406.5" width="11" height="11" rx="2.5" fill="#f59e0b" />
    <text x="306" y="415.5">Partiel</text>

    <rect x="354" y="406.5" width="11" height="11" rx="2.5" fill="#e11d48" />
    <text x="370" y="415.5">Incorrect</text>

    <text x="432" y="415.5" fill="#fbbf24" font-weight="800">↑</text>
    <text x="444" y="415.5">Plus haut</text>

    <text x="506" y="415.5" fill="#fbbf24" font-weight="800">↓</text>
    <text x="518" y="415.5">Plus bas</text>
  </g>
</svg>
